DATABASE_URL=postgres://<USER>:<PASSWORD>@<HOST>:<PORT>/<DATABASE>
# NestJs Project
MODE=DEV
RUN_MIGRATIONS=false
JWT_EXPIRATION=3600s
JWT_PUBLIC_KEY_VALUE=<PUBLIC_KEY>  #"-----BEGIN PUBLIC KEY-----\nYOUR_KEY\n-----END PUBLIC KEY-----"
JWT_PRIVATE_KEY_VALUE=<PRIVATE_KEY> #"-----BEGIN PRIVATE KEY-----\nYOUR_KEY\n-----END PRIVATE-----"
JWT_PRIVATE_KEY_JSON='{"key": "<JWT_PRIVATE_KEY_VALUE>","type": "RS512"}' # Substitute with your private key
JWT_PUBLIC_KEY_JSON='{"key": "<JWT_PUBLIC_KEY_VALUE>","type": "RS512"}' # Substitute with your public key

# For letsncrypt and nginx-proxy services (If using any NGINX docker-compose.yml)
VIRTUAL_HOST_MAIN=<YOUR_DOMAIN_OR_SUBDOMAIN> # For nestjs app
SUBDOMAIN_HASURA=<SUBDOMAIN_HASURA>
SUBDOMAIN_POSTGRES=<SUBDOMAIN_HASURA>
LETSENCRYPT_EMAIL_MAIN=<YOUR_EMAIL>

# For hasura service
HASURA_ADMIN_SECRET_KEY=<YOUR_OWN_PASSWORD>
HASURA_CORS_DOMAIN="*" # By default will allow all domains
